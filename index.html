<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal · Sijil</title>
<link rel="icon" href="icon.png">
<style>
:root { --ink:#16202C; --muted:#5B6878; --green:#047857; --line:#E6E0D2; --bg:#F6F1E7; --card:#fff; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.7 "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, Arial, sans-serif; }
header { background: var(--ink); color: #fff; }
.bar { max-width: 820px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
.bar img { width: 40px; height: 40px; border-radius: 10px; }
.bar b { font-size: 20px; }
.bar a { margin-inline-start: auto; color: #fff; text-decoration: none; font-size: 15px;
  border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 5px 14px; }
main { max-width: 820px; margin: 24px auto; padding: 8px 28px 28px; background: var(--card);
  border: 1px solid var(--line); border-radius: 18px; }
h1 { font-size: 28px; line-height: 1.3; margin: 18px 0 4px; }
h2 { font-size: 21px; margin: 30px 0 8px; padding-top: 6px; border-top: 1px solid var(--line); }
h3 { font-size: 18px; margin: 22px 0 6px; }
p, li { color: #253244; }
ul { padding-inline-start: 22px; }
a { color: var(--green); }
footer { max-width: 820px; margin: 0 auto 40px; padding: 0 20px; color: var(--muted); font-size: 14px; }
footer a { color: var(--muted); }
.cards { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; margin: 20px 0 8px; }
.cards a { display: block; padding: 18px; border: 1px solid var(--line); border-radius: 14px;
  text-decoration: none; color: var(--ink); background: #FFFDF8; font-weight: 600; }
.cards a span { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }
@media (max-width: 560px) { main { margin: 12px; padding: 4px 18px 18px; } .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><div class="bar"><img src="icon.png" alt=""><b>Sijil</b>
</div></header>
<main>

</html>
